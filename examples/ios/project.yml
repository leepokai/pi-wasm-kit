name: PiWasmExample
options:
  bundleIdPrefix: com.leepokai.piwasm
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
targets:
  PiWasmExample:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leepokai.piwasm.example
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PiWasmExampleTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{ target: PiWasmExample }]
  PiWasmExampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{ target: PiWasmExample }]
schemes:
  PiWasmExample:
    build:
      targets:
        PiWasmExample: all
    test:
      targets: [PiWasmExampleTests, PiWasmExampleUITests]
