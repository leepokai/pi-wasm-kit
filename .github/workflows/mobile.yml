name: Mobile examples
on:
  push:
    paths-ignore: ["**/*.md", "docs/**", "logos/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "logos/**"]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci && npm run build:demo
      - run: ./gradlew :app:assembleDebug :app:lintDebug
        working-directory: examples/android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          script: |
            npm run preview -- --port 4173 --strictPort > /tmp/preview.log 2>&1 &
            for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && break || sleep 1; done
            adb install -r examples/android/app/build/outputs/apk/debug/app-debug.apk
            python3 examples/android/test/recovery.py
  ios:
    # iOS 26 simulators can hang at "Waiting on BackBoard" on macos-15 VMs
    # (actions/runner-images#12777); macOS 26 hosts with newer Xcode are far more reliable.
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: xcodebuild -version
      - run: brew install xcodegen
      - run: npm ci && npm run build:demo
      - run: xcodegen generate --spec examples/ios/project.yml
      - name: Build for testing
        run: |
          # Newest installed iOS 26.x runtime.
          simulator=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((tuple(map(int, re.findall(r"\d+", r.split("iOS-")[1]))), r) for r in devices if "iOS-26" in r)
          print(next(d["udid"] for _, r in reversed(runtimes) for d in devices[r] if "iPhone" in d["name"]))')
          echo "SIMULATOR=$simulator" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$simulator"
          xcodebuild build-for-testing -project examples/ios/PiWasmExample.xcodeproj -scheme PiWasmExample -destination "platform=iOS Simulator,id=$simulator" -derivedDataPath examples/ios/build/dd
      - name: Boot simulator and run lifecycle and UI tests
        timeout-minutes: 40
        run: |
          # Run a command, sending SIGTERM (exit 143) if it has not finished after $1 seconds.
          with_timeout() {
            local seconds=$1; shift
            "$@" & local pid=$!
            ( sleep "$seconds"; kill -TERM "$pid" 2>/dev/null ) & local watchdog=$!
            local status=0; wait "$pid" || status=$?
            kill "$watchdog" 2>/dev/null || true
            return "$status"
          }
          boot() {
            for attempt in 1 2 3; do
              with_timeout 240 xcrun simctl bootstatus "$SIMULATOR" -b && return 0
              echo "::warning::Simulator boot attempt $attempt stalled; erasing and retrying"
              xcrun simctl shutdown "$SIMULATOR" || true
              xcrun simctl erase "$SIMULATOR" || true
            done
            return 1
          }
          run_tests() {
            with_timeout 600 xcodebuild test-without-building -project examples/ios/PiWasmExample.xcodeproj -scheme PiWasmExample -destination "platform=iOS Simulator,id=$SIMULATOR" -derivedDataPath examples/ios/build/dd
          }
          npm run preview -- --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && break || sleep 1; done
          boot
          status=0; run_tests || status=$?
          # Retry once only when the watchdog stopped a hung run, never after a test failure.
          if [ "$status" -eq 143 ]; then
            echo "::warning::xcodebuild produced no result in 10 minutes; rebooting the simulator and retrying once"
            xcrun simctl shutdown "$SIMULATOR" || true
            xcrun simctl uninstall "$SIMULATOR" com.leepokai.piwasm.example 2>/dev/null || true
            boot
            status=0; run_tests || status=$?
          fi
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-test-results
          path: examples/ios/build/dd/Logs/Test/
