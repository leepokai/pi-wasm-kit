name: Mobile examples
on:
  push:
    paths-ignore: ["**/*.md", "docs/**", "logos/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "logos/**"]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci && npm run build:demo
      - run: ./gradlew :app:assembleDebug :app:lintDebug
        working-directory: examples/android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          script: |
            npm run preview -- --port 4173 --strictPort > /tmp/preview.log 2>&1 &
            for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && break || sleep 1; done
            adb install -r examples/android/app/build/outputs/apk/debug/app-debug.apk
            python3 examples/android/test/recovery.py
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
      - run: brew install xcodegen
      - run: npm ci && npm run build:demo
      - run: xcodegen generate --spec examples/ios/project.yml
      - name: Run simulator lifecycle and UI tests
        run: |
          npm run preview -- --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          simulator=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in d["devices"].items() if "iOS-26" in runtime for x in devices if "iPhone" in x["name"]))')
          xcodebuild test -project examples/ios/PiWasmExample.xcodeproj -scheme PiWasmExample -destination "platform=iOS Simulator,id=$simulator" -derivedDataPath examples/ios/build/dd
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-test-results
          path: examples/ios/build/dd/Logs/Test/
